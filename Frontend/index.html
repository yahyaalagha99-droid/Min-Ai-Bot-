<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a12">
  <meta name="description" content="Min AI — مساعدك الذكي للدردشة بالصوت أو الكتابة.">
  <title>Min AI — مساعدك الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080a12;--panel:#101522;--muted:#929bb0;--cyan:#67e8f9;--violet:#9b8cff;--border:#252d40}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:#f5f7ff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 20%,#18213b 0%,#0b1020 40%,var(--bg) 78%)}
    .shell{max-width:900px;margin:auto;min-height:100vh;padding:20px 20px 16px;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px}
    .brand-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6de9f5,#8a72ff);color:#080a12;font-weight:800;box-shadow:0 0 28px #66dff544}
    .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;border:1px solid var(--border);padding:7px 11px;border-radius:30px;background:#101522aa}
    .dot{width:8px;height:8px;border-radius:50%;background:#687188}.dot.live{background:#54e5a4;box-shadow:0 0 12px #54e5a4}
    main{flex:1;display:flex;flex-direction:column;align-items:center;padding:35px 0 12px}
    .intro{text-align:center}.eyebrow{color:#9ca9c7;font-size:12px;letter-spacing:2px;margin-bottom:5px}
    h1{font-size:clamp(28px,5vw,42px);margin:0;font-weight:600}.sub{color:var(--muted);margin:8px 0 0;font-size:14px}
    .orb-wrap{width:min(42vw,190px);min-width:135px;aspect-ratio:1;display:grid;place-items:center;position:relative;margin:20px auto 8px}
    .ring{position:absolute;inset:5%;border:1px solid #7bdff52c;border-radius:50%;box-shadow:0 0 40px #5d8dff12,inset 0 0 40px #5d8dff0c}
    .ring.r2{inset:16%;border-color:#a58aff35}.orb{width:56%;aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 34% 28%,#e8ffff 0,#8beaff 8%,#567bdb 32%,#493b9b 62%,#15142e 100%);box-shadow:0 0 35px #6bdffb99,0 0 75px #765bff55,inset -18px -22px 35px #080a2b}
    .orb:before,.orb:after{content:"";position:absolute;border-radius:50%;filter:blur(13px)}.orb:before{width:70%;height:40%;top:18%;left:12%;background:#d9ffff88;transform:rotate(-35deg)}.orb:after{width:65%;height:50%;bottom:-8%;right:-5%;background:#9b5cff77}
    .orb-wrap.active .orb{animation:pulse 1.8s ease-in-out infinite}.orb-wrap.active .ring.r2{animation:spin 8s linear infinite}
    @keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.2)}}@keyframes spin{to{transform:rotate(360deg)}}
    .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
    button{font:inherit;cursor:pointer;border:0;transition:.2s}.talk{min-width:190px;padding:12px 20px;border-radius:15px;color:#071018;font-weight:700;background:linear-gradient(110deg,#79e8f3,#a69aff);box-shadow:0 8px 30px #6fdcf533}
    .talk:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}.talk:disabled{opacity:.55;cursor:wait}.end{padding:11px 17px;border-radius:15px;color:#e6e9f5;background:#20283a;border:1px solid #343e55}.end:disabled{opacity:.5;cursor:not-allowed}
    .hint{color:#929bb0;font-size:12px;text-align:center;min-height:22px;margin:6px 0 14px}
    .conversation{width:min(100%,720px);background:#101522c9;border:1px solid #242d43;border-radius:18px;padding:15px}
    .conv-head{display:flex;justify-content:space-between;align-items:center;color:#cbd4e9;font-size:13px;margin-bottom:10px}
    #messages{height:min(32vh,260px);min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px}
    .msg{padding:9px 12px;border-radius:13px;line-height:1.75;font-size:14px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
    .msg.user{align-self:flex-start;background:#202c45;color:#e6efff}.msg.ai{align-self:flex-end;background:#20213c;color:#e7e2ff}.empty{color:#77839d;text-align:center;font-size:13px;margin:auto}
    .composer{width:min(100%,720px);display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0;padding:11px 13px;border:1px solid #343e55;border-radius:13px;background:#101522;color:#fff;font:inherit;outline:none}.composer input:focus{border-color:var(--violet)}.composer button{padding:0 16px;border-radius:13px;color:#071018;font-weight:700;background:linear-gradient(110deg,#79e8f3,#a69aff)}
    .options{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;margin-top:9px}.options input{accent-color:#9b8cff}
    footer{text-align:center;color:#65708a;font-size:11px;padding-top:13px}
    @media(max-width:600px){.shell{padding:16px 13px 12px}main{padding-top:25px}.conversation{padding:12px}#messages{height:30vh}.composer button{padding:0 12px}.status{font-size:11px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="brand-mark">M</div><span>MIN AI</span></div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">جاهز</span></div>
    </header>
    <main>
      <section class="intro" aria-labelledby="pageTitle">
        <div class="eyebrow">YOUR PERSONAL AI</div>
        <h1 id="pageTitle">مرحباً، أنا Min AI</h1>
        <p class="sub">اكتب لي أو تحدث، وسأجيبك عبر مساعد الذكاء الاصطناعي</p>
      </section>
      <div class="orb-wrap" id="orbWrap" aria-hidden="true"><div class="ring"></div><div class="ring r2"></div><div class="orb"></div></div>
      <div class="controls">
        <button class="talk" id="micBtn" type="button">🎙 ابدأ التحدث</button>
        <button class="end" id="stopBtn" type="button" disabled>إيقاف الاستماع</button>
      </div>
      <div class="hint" id="hint" role="status" aria-live="polite">يمكنك التحدث أو كتابة رسالتك بالأسفل</div>
      <section class="conversation" aria-label="المحادثة">
        <div class="conv-head"><span>المحادثة</span><span>MIN AI</span></div>
        <div id="messages" aria-live="polite"><div class="empty" id="empty">ستظهر المحادثة هنا عندما تبدأ</div></div>
      </section>
      <form class="composer" id="chatForm">
        <input id="userInput" type="text" autocomplete="off" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك">
        <button id="sendBtn" type="submit">إرسال ↑</button>
      </form>
      <label class="options"><input type="checkbox" id="speakReplies" checked> قراءة ردود Min AI بصوت مسموع</label>
    </main>
    <footer>MIN AI · يستخدم خادم التطبيق ومفتاح GROQ_API_KEY المضبوط على الخادم</footer>
  </div>
  <script src="/script.js" defer></script>
</body>
</html>
