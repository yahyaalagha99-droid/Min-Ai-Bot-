
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090713">
  <meta name="description" content="My Ai Bot - مساعدك الذكي">
  <title>My Ai Bot</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>

<body>
  <div class="app-shell">

    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div class="brand-info">
          <h1>My Ai Bot</h1>
          <span>YOUR PERSONAL AI ASSISTANT</span>
        </div>
      </div>

      <div class="connection-status">
        <span class="status-dot"></span>
        <span id="status-text">جاهز</span>
      </div>
    </header>

    <main class="main-content">

      <section class="assistant-stage">
        <div class="orb-wrapper" id="orb">
          <div class="orb-glow"></div>
          <div class="orb-ring orb-ring-one"></div>
          <div class="orb-ring orb-ring-two"></div>

          <div class="orb-core">
            <div class="orb-shine"></div>
            <div class="orb-center">✦</div>
          </div>
        </div>

        <div class="assistant-intro">
          <p class="eyebrow">INTELLIGENT ASSISTANT</p>
          <h2 id="welcome-title">مرحباً، أنا My Ai Bot</h2>
          <p id="welcome-subtitle">
            أنا هنا لمساعدتك. اسألني أو أخبرني بما تريد إنجازه.
          </p>
        </div>
      </section>

      <section id="chat" class="chat-area" aria-live="polite">
        <div class="welcome-hint">
          <span>✦</span>
          <p>ابدأ محادثتك الآن</p>
        </div>
      </section>

      <div id="image-preview-container" class="attachment-preview"></div>

      <form id="f" class="composer">

        <div class="composer-tools">
          <div class="attachment-menu-wrapper">
            <button
              type="button"
              id="plus-btn"
              class="tool-button"
              aria-label="إضافة مرفق"
            >+</button>

            <div id="attachment-menu" class="attachment-menu hidden">
              <button type="button" id="choose-image">
                <span>▧</span> اختيار صورة
              </button>
              <button type="button" id="open-camera">
                <span>◎</span> فتح الكاميرا
              </button>
              <button type="button" id="choose-file" disabled>
                <span>▤</span> الملفات قريباً
              </button>
            </div>
          </div>

          <input
            id="file-input"
            type="file"
            accept="image/*"
            hidden
          >

          <input
            id="camera-input"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
          >

          <input
            id="q"
            type="text"
            placeholder="اكتب رسالتك إلى My Ai Bot..."
            autocomplete="off"
            aria-label="اكتب رسالتك"
          >

          <button
            type="button"
            id="mic-btn"
            class="tool-button mic-button"
            aria-label="التحدث"
            title="التحدث"
          >
            <span>🎙</span>
          </button>

          <button
            type="submit"
            id="send"
            class="send-button"
            aria-label="إرسال"
          >
            <span>➤</span>
          </button>
        </div>

        <p class="composer-note">
          My Ai Bot يمكن أن يخطئ أحياناً، تحقق من المعلومات المهمة.
        </p>
      </form>

    </main>

    <footer class="app-footer">
      <span>My Ai Bot</span>
      <span>•</span>
      <span>Developed by Yahya.Kurdish</span>
    </footer>

  </div>
</body>
</html>
