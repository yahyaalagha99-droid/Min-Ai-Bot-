<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            letter-spacing: 5px;
            margin-bottom: 5px;
            font-weight: 300;
            color: #94a3b8;
            font-size: 28px;
        }
        .orb-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .orb {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ff1a1a 0%, #990000 60%, #330000 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px #ff0000, 0 0 100px #ff1a1a;
            animation: pulse 2s infinite ease-in-out;
        }
        .orb.active {
            animation: speak 0.6s infinite alternate ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 30px #ff0000; }
            50% { transform: scale(1.05); box-shadow: 0 0 70px #ff3333; }
            100% { transform: scale(0.95); box-shadow: 0 0 30px #ff0000; }
        }
        @keyframes speak {
            0% { transform: scale(0.9); box-shadow: 0 0 40px #ff0000; }
            100% { transform: scale(1.2); box-shadow: 0 0 90px #ff6666; }
        }
        .input-box {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            width: 80%;
            max-width: 350px;
            font-size: 16px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
        }
        .input-box:focus {
            border-color: #ff1a1a;
            box-shadow: 0 0 10px rgba(255,26,26,0.4);
        }
        .btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            border-color: #ff1a1a;
            box-shadow: 0 0 15px rgba(255,26,26,0.4);
        }
        #status {
            margin-top: 20px;
            font-size: 15px;
            color: #38bdf8;
            height: 40px;
            text-align: center;
            padding: 0 20px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>JARVIS</h1>
    <div class="orb-container">
        <div class="orb" id="orb"></div>
    </div>
    <input type="text" id="userPrompt" class="input-box" placeholder="اكتب أمر التداول أو رأس المال هنا...">
    <button class="btn" onclick="startJavis()">تنفيذ الأمر</button>
    <div id="status">JARVIS جاهز للعمليات</div>

    <script>
        async function startJavis() {
            const orb = document.getElementById('orb');
            const status = document.getElementById('status');
            const promptText = document.getElementById('userPrompt').value;
            
            status.innerText = "جاري معالجة الأمر والتحليل...";
            orb.classList.add('active');

            try {
                const response = await fetch('/api/javis-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || "خطأ في السيرفر");
                }

                status.innerText = data.reply;

                if (data.audio) {
                    const audio = new Audio("data:audio/mp3;base64," + data.audio);
                    audio.play().catch(e => console.log("Audio play error:", e));
                    audio.onended = () => {
                        orb.classList.remove('active');
                    };
                } else {
                    orb.classList.remove('active');
                }
            } catch (err) {
                status.innerText = "خطأ: " + err.message;
                orb.classList.remove('active');
            }
        }
    </script>
</body>
</html>
