  <script>
    const form = document.getElementById('input-form');
    const promptInput = document.getElementById('prompt-input');
    const chatContainer = document.getElementById('chat-container');

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      appendMessage(prompt, 'user');
      promptInput.value = '';

      const loadingDiv = document.createElement('div');
      loadingDiv.classList.add('message', 'bot-message');
      loadingDiv.textContent = 'جاري التفكير...';
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // التقاط وقت ومنطقة المستخدم المحلية تلقائياً من جهازه
        const clientTime = new Date().toLocaleString();
        const clientTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        const formData = new FormData();
        formData.append('prompt', prompt);
        formData.append('clientTime', clientTime);
        formData.append('clientTimeZone', clientTimeZone);

        const res = await fetch('/api/chat', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        chatContainer.removeChild(loadingDiv);

        if (data.success) {
          appendMessage(data.reply, 'bot');
        } else {
          appendMessage('حدث خطأ: ' + (data.error || 'تعذّر الحصول على رد.'), 'bot');
        }
      } catch (err) {
        chatContainer.removeChild(loadingDiv);
        appendMessage('تعذر الاتصال بالسيرفر.', 'bot');
      }
    });
  </script>
