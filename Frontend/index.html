<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Ai Bot - Super Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f0c20; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #161233; padding: 15px 20px; text-align: center; border-bottom: 1px solid #2a2456; }
    header h1 { font-size: 1.4rem; color: #8b5cf6; }
    header p { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
    #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
    .user-message { align-self: flex-end; background-color: #6366f1; color: white; border-bottom-right-radius: 2px; }
    .bot-message { align-self: flex-start; background-color: #1e1b4b; color: #e0e0e0; border-bottom-left-radius: 2px; border: 1px solid #312e81; }
    #input-form { display: flex; padding: 12px; background-color: #161233; border-top: 1px solid #2a2456; gap: 8px; align-items: center; }
    #prompt-input { flex: 1; padding: 12px; border: 1px solid #312e81; border-radius: 8px; background-color: #0f0c20; color: white; outline: none; }
    #prompt-input:focus { border-color: #6366f1; }
    .file-upload-btn { background-color: #312e81; color: #fff; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; border: none; }
    .file-upload-btn:hover { background-color: #4338ca; }
    #file-input { display: none; }
    button[type="submit"] { background-color: #6366f1; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button[type="submit"]:hover { background-color: #4f46e5; }
    #file-name-display { font-size: 0.75rem; color: #a5b4fc; padding: 0 10px; }
  </style>
</head>
<body>

  <header>
    <h1>My Ai Bot 🤖</h1>
    <p>Developed by Yahya.Kurdish (Super Assistant Mode)</p>
  </header>

  <div id="chat-container">
    <div class="message bot-message">
      أهلاً بك يا Yahya! أنا مساعدك الذكي المتكامل. تم تفعيل الذاكرة، وقراءة الملفات، ودعم جميع اللغات. كيف أساعدك اليوم؟
    </div>
  </div>

  <div id="file-name-display"></div>

  <form id="input-form">
    <label for="file-input" class="file-upload-btn">📁 ملف</label>
    <input type="file" id="file-input">
    <input type="text" id="prompt-input" placeholder="اكتب رسالتك أو اسأل عن أي شيء..." autocomplete="off">
    <button type="submit">إرسال ↑</button>
  </form>

  <script>
    const form = document.getElementById('input-form');
    const promptInput = document.getElementById('prompt-input');
    const fileInput = document.getElementById('file-input');
    const chatContainer = document.getElementById('chat-container');
    const fileNameDisplay = document.getElementById('file-name-display');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        fileNameDisplay.textContent = "الملف المرفق: " + fileInput.files[0].name;
      }
    });

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      const file = fileInput.files[0];

      if (!prompt && !file) return;

      appendMessage(prompt + (file ? ` [ملف مرفق: ${file.name}]` : ''), 'user');
      promptInput.value = '';

      const loadingDiv = document.createElement('div');
      loadingDiv.classList.add('message', 'bot-message');
      loadingDiv.textContent = 'جاري التحليل والتفكير...';
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const clientTime = new Date().toLocaleString();
        const clientTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        const formData = new FormData();
        formData.append('prompt', prompt);
        formData.append('clientTime', clientTime);
        formData.append('clientTimeZone', clientTimeZone);
        if (file) {
          formData.append('file', file);
        }

        const res = await fetch('/api/chat', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        chatContainer.removeChild(loadingDiv);
        fileInput.value = '';
        fileNameDisplay.textContent = '';

        if (data.success) {
          appendMessage(data.reply, 'bot');
        } else {
          appendMessage('حدث خطأ: ' + (data.error || 'تعذّر الحصول على رد.'), 'bot');
        }
      } catch (err) {
        chatContainer.removeChild(loadingDiv);
        appendMessage('تعذر الاتصال بالسيرفر.', 'bot');
      }
    });
  </script>
</body>
</html>
